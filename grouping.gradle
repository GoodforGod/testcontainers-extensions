def explicitModuleGroups = [
        core     : ["common", "jdbc"],
        jdbc     : ["postgres", "mariadb", "mysql", "oracle", "cockroachdb", "clickhouse"],
        databases: ["cassandra", "scylla"],
        messaging: ["kafka", "redpanda", "nats", "rabbitmq"],
]

def groupedModules = explicitModuleGroups.values().flatten() as Set
def otherModules = rootProject.subprojects
        .collect { Project pj -> pj.name }
        .findAll { moduleName -> !groupedModules.contains(moduleName) }
        .sort()

def moduleGroups = explicitModuleGroups + [other: otherModules]

def addDependency = { TaskProvider taskProvider, String dependency ->
    taskProvider.configure { Task task -> task.dependsOn(dependency) }
}

def addDependencyByModuleGroup = { TaskProvider taskProvider, String groupName, String taskName ->
    def moduleNames = moduleGroups[groupName]
    rootProject.subprojects.forEach { Project pj ->
        if (!moduleNames.contains(pj.name)) {
            return
        }

        addDependency(taskProvider, "${pj.path}:${taskName}")
    }
}

def groupModules = { String groupName ->
    def capitalizedGroup = groupName.capitalize()

    def testByGroup = tasks.register("test${capitalizedGroup}") {
        group("verification")
        description("Run tests for ${groupName} modules")
    }
    addDependencyByModuleGroup(testByGroup, groupName, "test")

    def classesByGroup = tasks.register("classes${capitalizedGroup}") {
        group("build")
        description("Build classes for ${groupName} modules")
    }
    addDependencyByModuleGroup(classesByGroup, groupName, "classes")

    def testClassesByGroup = tasks.register("testClasses${capitalizedGroup}") {
        group("build")
        description("Build test classes for ${groupName} modules")
    }
    addDependencyByModuleGroup(testClassesByGroup, groupName, "testClasses")

    def buildByGroup = tasks.register("build${capitalizedGroup}") {
        group("build")
        description("Build ${groupName} modules")
    }
    addDependencyByModuleGroup(buildByGroup, groupName, "build")

    def checkByGroup = tasks.register("check${capitalizedGroup}") {
        group("verification")
        description("Run checks for ${groupName} modules")
    }
    addDependencyByModuleGroup(checkByGroup, groupName, "check")

    def jacocoTestReportByGroup = tasks.register("jacocoTestReport${capitalizedGroup}") {
        group("verification")
        description("Generate Jacoco test reports for ${groupName} modules")
    }
    addDependencyByModuleGroup(jacocoTestReportByGroup, groupName, "jacocoTestReport")
}

moduleGroups.keySet().forEach { groupName ->
    groupModules(groupName)
}
