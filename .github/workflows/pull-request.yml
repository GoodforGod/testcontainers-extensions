name: CI Pull Request

on:
  pull_request:
    branches:
      - master
      - dev

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Pull Request Java 17
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "adopt"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: ${{ github.ref == 'refs/heads/master' }}

      - name: Code Style
        run: "./gradlew spotlessCheck --no-daemon --no-parallel --stacktrace"

      - name: Gradle build classes
        run: "./gradlew classes --no-daemon --no-parallel --scan --stacktrace"

      - name: Gradle run tests and coverage
        run: "./gradlew test jacocoTestReport testCodeCoverageReport --no-daemon --no-parallel --scan --stacktrace"

      - name: SonarQube
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: "./gradlew sonar --no-daemon --no-parallel --stacktrace"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Test Report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            **/test-results/**/*.xml
